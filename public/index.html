const COL=['#14b8a6','#6366f1','#f59e0b','#ef4444','#22c55e','#8b5cf6','#ec4899','#64748b'];
const svgw=b=>`<svg viewBox="0 0 400 210" style="width:100%;height:auto;font-size:11px;fill:currentColor" role="img">${b}<line x1="35" y1="170" x2="390" y2="170" stroke="#888" stroke-opacity=".5"/></svg>`;
const noD=t=>`<div class="card"><h3>${t}</h3>${emp('No data yet','This chart fills in as activity is recorded.','','dashboard')}</div>`;
function vbar(t,a,col,max){if(!a.length)return noD(t);const m=max||Math.max(1,...a.map(x=>x.value)),w=350/Math.max(a.length,1);return`<div class="card"><h3>${t}</h3>${svgw(a.map((x,i)=>{const h=x.value/m*140,X=38+i*w;return`<rect x="${X+6}" y="${170-h}" width="${w-12}" height="${h}" rx="6" fill="${col?col(x):COL[i%8]}"/><text x="${X+w/2}" y="${164-h}" text-anchor="middle">${x.value}</text><text x="${X+w/2}" y="188" text-anchor="middle">${esc(String(x.name).slice(0,11))}</text>`}).join(''))}</div>`}
function line(t,a){if(!a.length)return noD(t);const m=Math.max(1,...a.map(x=>x.value)),n=Math.max(a.length-1,1),P=a.map((x,i)=>[40+i*345/n,170-x.value/m*140]);return`<div class="card"><h3>${t}</h3>${svgw(`<polyline fill="none" stroke="#14b8a6" stroke-width="3" stroke-linejoin="round" points="${P.map(p=>p.join(',')).join(' ')}"/>`+P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#14b8a6"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle">${a[i].value}</text>`+(i%2?'':`<text x="${p[0]}" y="188" text-anchor="middle">${esc(a[i].name.slice(5))}</text>`)).join(''))}</div>`}
function donut(t,a){const tot=a.reduce((s,x)=>s+x.value,0);if(!tot)return noD(t);let off=0;return`<div class="card"><h3>${t}</h3><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><svg viewBox="0 0 42 42" style="width:170px;transform:rotate(-90deg)" role="img"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#88888833" stroke-width="6"/>${a.map((x,i)=>{const p=x.value/tot*100,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${COL[i]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}"/>`;off+=p;return s}).join('')}</svg><div>${a.map((x,i)=>`<div style="margin:4px 0"><span style="color:${COL[i]}">●</span> ${esc(x.name)} — <b>${Math.round(x.value/tot*100)}%</b></div>`).join('')}</div></div></div>`}
const SC=(l,v,i,c,sub,pct)=>`<div class="card sc"><div class="si ${c}">${ic(i,20)}</div><span class="sl">${l}</span><b>${(+v).toLocaleString()}</b>${sub?`<small>${sub}</small>`:''}${pct!=null?`<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`:''}</div>`;

 <div class="card noprint"><b>Export CSV:</b> ${['distributions','beneficiaries','unserved','duplicates','ngo-performance','coverage','audit'].map(r=>`<a style="color:var(--a)" href="/api/reports/${r}?format=csv">${r}</a>`).join(' · ')}</div>`}

async function pWorkers(){const r=(await api('/users')).data;app.innerHTML=H('Field workers','Add new workers or remove workers who no longer need access.')+`<div class="card"><h3>Add worker</h3><div class="two">${F('wn','Full name','','e.g. Ayesha Khan')}${F('we','Email','type=email autocomplete=off','worker@example.org')}${F('wp','Password (8+ characters)','type=password autocomplete=new-password','Minimum 8 characters')}${me.role==='SUPER_ADMIN'?SEL('wo','Organization',opts(r.orgs,0,['id','name'])):''}</div><button id="wa">${ic('register',16)}Add worker</button></div>
 <div class="card"><div class="tb"><div class="sr"><span>${ic('search')}</span><input id="ws" aria-label="Search workers" placeholder="Search workers..."></div></div>${r.users.length?`<div class="tw"><table class="rt" id="wt"><thead><tr><th>Name</th><th>Email</th><th>Organization</th><th></th></tr></thead><tbody>${r.users.map(u=>`<tr><td data-label="Name"><span style="display:inline-flex;align-items:center;gap:10px">${av(u.name)}${esc(u.name)}</span></td><td data-label="Email">${esc(u.email)}</td><td data-label="Organization">${esc(u.org)}</td><td><button class="red sm" onclick="dw(${u.id})">${ic('trash',15)}Remove</button></td></tr>`).join('')}</tbody></table></div>`:emp('No workers yet','Workers you add will appear here.','','workers')}</div>`;
 filt('#ws',null,'#wt');
 $('#wa').onclick=e=>busy(e.currentTarget,'Adding...',async()=>{fe('wn',$('#wn').value.trim().length<2?'Enter the worker’s name.':'');fe('we',/^\S+@\S+\.\S+$/.test($('#we').value)?'':'Enter a valid email address.');fe('wp',$('#wp').value.length<8?'Password must be at least 8 characters.':'');if($('#wn-e').textContent||$('#we-e').textContent||$('#wp-e').textContent)return;
  try{await api('/users',{method:'POST',body:{name:$('#wn').value,email:$('#we').value,password:$('#wp').value,organizationId:+$('#wo')?.value||undefined}});toast('Worker added','ok');pWorkers()}catch(e){toast(e.message,'err')}})}
async function dw(id){if(!confirm('Delete this worker? Their past records stay in the audit trail.'))return;try{await api('/users/'+id,{method:'DELETE'});toast('Worker deleted','ok');pWorkers()}catch(e){toast(e.message,'err')}}
const cov=c=>`<div class="card"><h3>Coverage by village (last 30 days)</h3>${c.map(v=>`<div style="margin:10px 0">${esc(v.name)} — <b>${v.coverage}%</b> (${v.served}/${v.households}) ${v.criticalGap?bd('CRITICAL GAP','r'):''}<div class="bar"><i style="width:${v.coverage}%;background:${{GREEN:'var(--g)',YELLOW:'var(--w)',RED:'var(--r)'}[v.band]}"></i></div></div>`).join('')||emp('No coverage data yet','Villages appear once enough families are registered.')}</div>`;
const bars=(t,a)=>{const m=Math.max(1,...a.map(x=>x.value));return`<div class="card"><h3>${t}</h3>${a.map(x=>`<div style="margin:10px 0">${esc(x.name)} <b>${x.value}</b><div class="bar"><i style="width:${x.value*100/m}%"></i></div></div>`).join('')||emp('No data yet','')}</div>`};

async function pDup(){const r=(await api('/duplicates')).data;app.innerHTML=H('Duplicate cases','Possible repeat registrations and blocked repeat-aid attempts.')+(r.map(c=>`<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b>${c.case_code}</b>${bd(c.match_band)}<span class="tag">${Math.round(c.match_score*100)}% match</span>${bd(c.status)}<span class="tag">${c.trigger_type}</span></div><p style="margin-top:8px">${c.a_id} ${esc(c.a_name)} ↔ ${c.b_id?c.b_id+' '+esc(c.b_name):'(distribution attempt)'}</p>
 ${c.status==='OPEN'&&canResolve()?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="sm" onclick="rs(${c.id},'NOT_DUPLICATE',this)">Not duplicate</button><button class="red sm" onclick="rs(${c.id},'CONFIRMED_DUPLICATE',this)">Confirm</button>${c.b_id?`<button class="sec sm" onclick="rs(${c.id},'MERGED',this)">Merge</button>`:''}</div>`:''}</div>`).join('')||`<div class="card">${emp('No duplicate cases','Flagged duplicates will appear here for review.','','duplicates')}</div>`)}
async function rs(id,resolution,b){await busy(b,'Saving...',async()=>{try{await api(`/duplicates/${id}/resolve`,{method:'POST',body:{resolution}});toast('Case resolved','ok');pDup()}catch(e){toast(e.message,'err')}})}
async function pReq(){const r=(await api('/requests')).data;app.innerHTML=H('Relief requests','Review and decide on incoming requests.',`<a href="#/request"><button class="sec">Submit Relief Request</button></a>`)+`<div class="card"><div class="tb"><div class="sr"><span>${ic('search')}</span><input id="rsq" aria-label="Search requests" placeholder="Search requests..."></div><select id="rsf" aria-label="Filter by status"><option value="">All statuses</option>${['PENDING','VERIFIED','APPROVED','REJECTED','FULFILLED'].map(s=>`<option>${s}</option>`).join('')}</select></div>
 ${r.length?`<div class="tw"><table class="rt" id="rtb"><thead><tr><th>Request</th><th>Name</th><th>Village</th><th>Family</th><th>Aid</th><th>Status</th><th></th></tr></thead><tbody>${r.map(x=>`<tr data-s="${x.status}"><td data-label="Request"><b>${x.request_code}</b></td><td data-label="Name">${esc(x.requester_name)}</td><td data-label="Village">${esc(x.village)}</td><td data-label="Family">${x.family_size}</td><td data-label="Aid">${esc(x.aid)}</td><td data-label="Status">${bd(x.status)}</td><td>${x.status==='PENDING'?`<button class="sm" onclick="rq(${x.id},'APPROVED',this)">Approve</button> <button class="red sm" onclick="rq(${x.id},'REJECTED',this)">Reject</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:emp('No relief requests yet','When someone submits a relief request, it will appear here.','<a href="#/request"><button>Submit Relief Request</button></a>','requests')}</div>`;filt('#rsq','#rsf','#rtb')}
async function rq(id,status,b){await busy(b,'Saving...',async()=>{try{await api(`/requests/${id}/status`,{method:'PUT',body:{status}});toast(status==='APPROVED'?'Request approved':'Request rejected','ok');pReq()}catch(e){toast(e.message,'err')}})}
async function pAudit(){const [a,v]=await Promise.all([api('/audit'),['SUPER_ADMIN','RELIEF_ADMIN','NGO_ADMIN','VERIFIER'].includes(me.role)?api('/audit/verify-chain'):Promise.resolve(null)]);
 app.innerHTML=H('Audit ledger','Every action is recorded in a tamper-evident chain.')+`${v?`<div class="card ${v.data.valid?'good':'bad'}"><div class="int"><div class="si ${v.data.valid?'g':'r'}">${ic(v.data.valid?'verify':'alert',22)}</div><div>${v.data.valid?'✓ Ledger Integrity Verified':'✗ Ledger tampering detected at #'+v.data.brokenAt}<br><small class="m" style="font-weight:500">${v.data.checked} records checked</small></div></div></div>`:''}<div class="card"><div class="tb"><div class="sr"><span>${ic('search')}</span><input id="rf" aria-label="Filter by Relief ID" placeholder="Filter by Relief ID, press Enter" ${me.role==='DONOR_AUDITOR'?'disabled':''}></div></div></div><div id="tl">${tl(a.data)}</div>`;
 $('#rf').onkeydown=async e=>{if(e.key==='Enter'){$('#tl').innerHTML=SK;try{$('#tl').innerHTML=tl((await api('/audit?reliefId='+encodeURIComponent(e.target.value))).data)}catch(x){$('#tl').innerHTML='';toast(x.message,'err')}}}}
const tl=a=>a.length?`<div class="tl">${a.map(x=>{const [d,i]=al(x.action),[st,k]=AS(x.action);return`<div class="te"><div class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${av(x.usr||x.org)}<div style="flex:1;min-width:160px"><b>${d}</b> <span class="tag">${x.action}</span><br><small class="m">WHO: ${esc(x.usr||'—')}${x.org?' · '+esc(x.org):''} · ENTITY: ${x.relief_id||'—'}</small></div><div style="text-align:right">${bd(st,k)}<br><small class="m">WHEN: ${new Date(x.created_at).toLocaleString()}</small></div></div><div class="hs" style="margin-top:8px">#${x.id} · ${x.hash.slice(0,24)}…</div></div></div>`}).join('')}</div>`:`<div class="card">${emp('No audit records','Records will appear here as actions are taken.')}</div>`;

async function pPublic(){const s=(await api('/public/summary')).data;app.innerHTML=H('Public transparency dashboard','Aggregated data only. No personal information is shown.')+`<div class="grid">${[['households','Households','workers','t'],['served','Served','verify','g'],['packages','Aid packages','heart','i'],['unreached','Unreached','alert','w'],['duplicateCases','Open duplicate cases','duplicates','r']].map(([k,l,i,c])=>SC(l,s[k],i,c)).join('')}</div><div class="grid2" style="margin-top:14px">${cov(s.coverage)}${bars('Aid by category',s.byAid)}</div>${bars('Aid by organization',s.byOrg)}`}
async function pRequest(){const L=meta.locations;app.innerHTML=H('Request relief','Tell us what your family needs. It only takes a minute.')+`<div class="card" id="frm">${STP(1,'Personal information')}${F('n','Your name','autocomplete=name','Full name')}${F('p','Phone (if you have one)','type=tel','03XX XXXXXXX')}
${STP(2,'Family information')}<div class="two">${SEL('v','Village',opts(L,0,['id','name']))}${F('f','Family size','type=number min=1 value=4')}${SEL('d','Are you displaced?','<option value="DISPLACED">Yes, I left my home</option><option value="RESIDENT">No</option>')}</div>
${STP(3,'Relief needed')}${SEL('a','What do you need?',opts(meta.aidTypes,0,['code','name']))}<button class="big" id="s">Submit Relief Request</button></div><div id="out" aria-live="polite"></div>`;
 $('#s').onclick=e=>busy(e.currentTarget,'Submitting...',async()=>{fe('n',$('#n').value.trim().length<2?'Please enter your name.':'');fe('f',+$('#f').value<1?'Family size must be at least 1.':'');if($('#n-e').textContent||$('#f-e').textContent)return;
  try{const r=(await api('/requests',{method:'POST',body:{name:$('#n').value,locationId:+$('#v').value,familySize:+$('#f').value,displacement:$('#d').value,aidType:$('#a').value,phone:$('#p').value}})).data;$('#frm').hidden=true;$('#out').innerHTML=`<div class="card good pulse" style="text-align:center"><div class="ok">${ic('check',30)}</div><h3>Request received</h3>Request ID: <b>${r.requestId}</b><br>Status: ${bd(r.status,'w')}<p class="m" style="margin-top:8px">Keep your Request ID. Our team will review it shortly.</p><button class="sec" onclick="pRequest()">Submit another request</button></div>`;toast('Relief request submitted','ok')}catch(e){$('#out').innerHTML=`<div class="card bad"><b>${offline(e)?'No internet connection. Please try again.':esc(e.message)}</b></div>`;toast(offline(e)?'No internet connection.':e.message,'err')}})}

(async()=>{try{meta=(await api('/public/meta')).data}catch{}try{me=(await api('/auth/me')).data}catch{}render()})();
</script></body></html>
